<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koliya</title>
<meta name="description" content="Le réseau social privé des étudiants universitaires algériens.">
<meta name="theme-color" content="#FAFAF9">

<link rel="manifest" href="manifest_sm.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563EB'/><path d='M26 12 16 7 6 12l10 5z' fill='%23fff'/><path d='M10 14.5V18c0 1.6 2.7 2.8 6 2.8s6-1.2 6-2.8v-3.5' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/></svg>">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Koliya">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base_sm.css">
<link rel="stylesheet" href="css/components_sm.css">
<link rel="stylesheet" href="css/layout_sm.css">

<script>
  // Paint the right theme before first frame, so there is no white flash
  // on a dark-mode device. Reads the same key store_sm.js writes.
  try {
    var t = JSON.parse(localStorage.getItem('kl:pref:theme') || '"system"');
    var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name=theme-color]').content = dark ? '#0F1115' : '#FAFAF9';
    var loc = JSON.parse(localStorage.getItem('kl:pref:locale') || '"fr"');
    document.documentElement.lang = loc;
    document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
</script>
</head>
<body>

<a class="skip-link" href="#main">Aller au contenu</a>

<!-- ============ BOOT ============ -->
<div id="boot" class="col center" style="height:100dvh;gap:var(--s4)">
  <div style="font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em">Koliya</div>
  <div class="spinner"></div>
</div>

<!-- ============ AUTH (filled by auth_sm.js) ============ -->
<div id="auth" class="hidden"></div>

<!-- ============ APP SHELL ============ -->
<div id="app" class="app hidden" data-rail="expanded">

  <!-- ---- NAV RAIL ----
       No fold button. It collapses on its own when you open a
       conversation and expands when the mouse comes near. -->
  <nav class="nav-rail" id="rail" aria-label="Navigation principale">
    <div class="rail-logo">
      <span class="mark">K</span>
      <span class="word">Koliya</span>
    </div>

    <div class="rail-nav" id="railNav">
      <a class="nav-item primary" href="#/feed" data-nav="feed">
        <i data-icon="home"></i>
        <span class="lbl">Accueil</span>
      </a>
      <a class="nav-item primary" href="#/explore" data-nav="explore">
        <i data-icon="compass"></i>
        <span class="lbl">Explorer</span>
      </a>
      <a class="nav-item primary" href="#/messages" data-nav="messages">
        <i data-icon="message"></i>
        <span class="lbl">Messages</span>
        <span class="count hidden" id="badgeMessages">0</span>
      </a>
      <a class="nav-item primary" href="#/notifications" data-nav="notifications">
        <i data-icon="bell"></i>
        <span class="lbl">Notifications</span>
        <span class="count hidden" id="badgeNotifs">0</span>
      </a>
      <a class="nav-item primary" href="#/hub" data-nav="hub">
        <i data-icon="trophy"></i>
        <span class="lbl">Hub</span>
      </a>
      <a class="nav-item" href="#/channels" data-nav="channels">
        <i data-icon="hash"></i>
        <span class="lbl">Canaux</span>
      </a>
      <a class="nav-item" href="#/events" data-nav="events">
        <i data-icon="calendar"></i>
        <span class="lbl">Événements</span>
      </a>
      <a class="nav-item" href="#/qa" data-nav="qa">
        <i data-icon="help"></i>
        <span class="lbl">Questions</span>
      </a>
      <a class="nav-item" href="#/saved" data-nav="saved">
        <i data-icon="bookmark"></i>
        <span class="lbl">Enregistrés</span>
      </a>
    </div>

    <div class="rail-compose">
      <button class="btn btn-primary btn-full btn-round" id="btnCompose" data-tip="N">
        <i data-icon="plus"></i>
        <span class="lbl">Publier</span>
      </button>
    </div>

    <button class="rail-foot" id="railMe" aria-label="Mon profil">
      <div class="av sm" id="myAvatar">?</div>
      <div class="who grow col" style="align-items:flex-start;line-height:1.2">
        <span class="t-bold t-sm truncate" id="myName">—</span>
        <span class="t-xs t-dim truncate" id="myHandle">—</span>
      </div>
    </button>
  </nav>

  <!-- ---- MAIN ---- -->
  <main class="main" id="main">
    <header class="topbar blur-bar">
      <button class="icon-btn back-btn" id="btnBack" aria-label="Retour" data-tip="Alt+←">
        <i data-icon="arrowLeft"></i>
      </button>
      <span class="topbar-title" id="topbarTitle">Accueil</span>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnSearch" aria-label="Rechercher" data-tip="Ctrl+K">
          <i data-icon="search"></i>
        </button>
        <button class="icon-btn" id="btnTheme" aria-label="Changer le thème">
          <i data-icon="moon"></i>
        </button>
        <button class="icon-btn" id="btnHelp" aria-label="Raccourcis clavier" data-tip="Ctrl+/">
          <i data-icon="keyboard"></i>
        </button>
      </div>
    </header>

    <div class="view" id="view">
      <div class="view-inner" id="viewInner"></div>
    </div>
  </main>

  <!-- ---- RIGHT RAIL: only appears above 1180px ---- -->
  <aside class="right-rail" id="rightRail" aria-label="Panneau latéral"></aside>
</div>

<!-- ============ OVERLAY LAYERS ============ -->
<div class="toasts" id="kl-toasts"></div>
<div id="kl-overlay"></div>
<div id="kl-menu"></div>

<noscript>
  <div style="padding:40px;text-align:center">
    Koliya nécessite JavaScript pour fonctionner.
  </div>
</noscript>

<script type="module" src="js/app_sm.js"></script>

</html>
