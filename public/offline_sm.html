<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Koliya</title>
<meta name="theme-color" content="#FAFAF9">
<link rel="stylesheet" href="css/base_sm.css">
<link rel="stylesheet" href="css/components_sm.css">
<script>
  try {
    var t = JSON.parse(localStorage.getItem('kl:pref:theme') || '"system"');
    var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
</script>
<style>
  body { overflow: hidden; display: grid; place-items: center; height: 100dvh; }
</style>
</head>
<body>

<div class="empty" style="max-width:380px">
  <div class="empty-art">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" style="width:34px;height:34px">
      <path d="M1 1l22 22"/>
      <path d="M16.7 16.7A11 11 0 0 1 12 18"/>
      <path d="M5 12.5a9 9 0 0 1 3.2-2.1M2 8.8a15 15 0 0 1 4.3-2.6"/>
      <path d="M10.7 5.1A15 15 0 0 1 22 8.8M18.4 12.1a11 11 0 0 0-2.6-1.6"/>
      <path d="M12 21h.01"/>
    </svg>
  </div>
  <div class="empty-title" id="ttl">You are offline</div>
  <div class="empty-text" id="txt">
    Koliya needs a connection to load posts and messages. Your drafts are kept.
  </div>
  <button class="btn btn-primary" id="retry">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
      <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
    </svg>
    <span id="retryLbl">Try again</span>
  </button>
  <p class="t-xs t-dim2" style="margin-top:var(--s4)" id="status">Waiting for the network…</p>
</div>

<script>
  /* This page has to work with no network at all, so it cannot import
     i18n_sm.js — it carries the three strings it needs and reads the
     language the student already chose out of localStorage. */
  const STR = {
    en: { ttl: 'You are offline',
          txt: 'Koliya needs a connection to load posts and messages. Your drafts are kept.',
          retry: 'Try again', wait: 'Waiting for the network…', back: 'Back online, reloading…' },
    fr: { ttl: 'Vous êtes hors ligne',
          txt: "Koliya a besoin d'une connexion pour charger les publications et les messages. Vos brouillons sont conservés.",
          retry: 'Réessayer', wait: 'En attente du réseau…', back: 'Connexion rétablie, rechargement…' },
    ar: { ttl: 'أنت غير متصل',
          txt: 'يحتاج كُلية إلى اتصال لتحميل المنشورات والرسائل. مسوّداتك محفوظة.',
          retry: 'أعد المحاولة', wait: 'في انتظار الشبكة…', back: 'عاد الاتصال، جارٍ إعادة التحميل…' }
  };
  let L = 'en';
  try { L = JSON.parse(localStorage.getItem('kl:pref:locale') || '"en"'); } catch (e) {}
  const S = STR[L] || STR.en;
  document.documentElement.lang = L;
  document.documentElement.dir = L === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('ttl').textContent = S.ttl;
  document.getElementById('txt').textContent = S.txt;
  document.getElementById('retryLbl').textContent = S.retry;

  const status = document.getElementById('status');
  status.textContent = S.wait;

  document.getElementById('retry').onclick = () => location.reload();

  // Come back automatically the moment the network returns —
  // no need to make the student keep tapping "retry".
  addEventListener('online', () => {
    status.textContent = S.back;
    setTimeout(() => location.replace('index_sm.html'), 400);
  });

  setInterval(() => {
    if (navigator.onLine) {
      status.textContent = S.back;
      location.replace('index_sm.html');
    }
  }, 4000);
</script>
</body>
</html>
