<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koliya — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base_sm.css">
<link rel="stylesheet" href="css/components_sm.css">
<link rel="stylesheet" href="css/layout_sm.css">
<style>
  .demo-bar{position:fixed;top:var(--s3);left:50%;transform:translateX(-50%);z-index:999;
    display:flex;gap:var(--s2);padding:var(--s2) var(--s3);border-radius:var(--r-full);
    border:1px solid var(--border);box-shadow:var(--shadow);font-size:var(--fs-xs)}
</style>
</head>
<body>
<div class="demo-bar blur-menu">
  <button class="btn btn-ghost btn-sm" id="bSignin">Connexion</button>
  <button class="btn btn-ghost btn-sm" id="bSignup">Inscription</button>
  <button class="btn btn-ghost btn-sm" id="bPending">En attente</button>
  <button class="btn btn-ghost btn-sm" id="bTheme">Thème</button>
</div>

<div id="auth"></div>
<div class="toasts" id="kl-toasts"></div>
<div id="kl-menu"></div>

<script type="module">
import { initStore } from './js/core/store_sm.js';
import { renderAuth, renderPending, setAuthMode } from './js/features/auth_ui_sm.js';
import { toast } from './js/core/ui_sm.js';

initStore();
setAuthMode('signin');
renderAuth(() => toast('Connexion réussie', 'ok'));

document.getElementById('bSignin').onclick  = () => { setAuthMode('signin'); renderAuth(()=>toast('OK','ok')); };
document.getElementById('bSignup').onclick  = () => { setAuthMode('signup'); renderAuth(()=>toast('OK','ok')); };
document.getElementById('bPending').onclick = () => renderPending(() => toast('Déconnecté'));
document.getElementById('bTheme').onclick   = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
};
</script>
