<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koliya — Messages</title>
<meta name="theme-color" content="#FAFAF9">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base_sm.css">
<link rel="stylesheet" href="css/components_sm.css">
<link rel="stylesheet" href="css/layout_sm.css">
<style>
  .hintbar {
    position: fixed; bottom: var(--s4); inset-inline-start: 50%;
    transform: translateX(-50%); z-index: 90;
    display: flex; gap: var(--s3); align-items: center;
    padding: var(--s2) var(--s4);
    border-radius: var(--r-full);
    border: 1px solid var(--border);
    font-size: var(--fs-xs); color: var(--text-2);
    box-shadow: var(--shadow);
  }
  .hintbar .kbd { margin-inline-start: 3px; }
</style>
</head>
<body>

<div id="app" class="app" data-rail="collapsed">
  <nav class="nav-rail" id="rail">
    <div class="rail-logo"><span class="mark">K</span><span class="word">Koliya</span></div>
    <div class="rail-nav">
      <a class="nav-item primary" href="#/feed"><i data-icon="home"></i><span class="lbl">Accueil</span></a>
      <a class="nav-item primary" href="#/explore"><i data-icon="compass"></i><span class="lbl">Explorer</span></a>
      <a class="nav-item primary on" href="#/messages"><i data-icon="message"></i><span class="lbl">Messages</span><span class="count">3</span></a>
      <a class="nav-item primary" href="#/notifications"><i data-icon="bell"></i><span class="lbl">Notifications</span></a>
      <a class="nav-item primary" href="#/hub"><i data-icon="trophy"></i><span class="lbl">Hub</span></a>
      <a class="nav-item" href="#/channels"><i data-icon="hash"></i><span class="lbl">Canaux</span></a>
      <a class="nav-item" href="#/events"><i data-icon="calendar"></i><span class="lbl">Événements</span></a>
    </div>
    <div class="rail-compose">
      <button class="btn btn-primary btn-full"><i data-icon="plus"></i><span class="lbl">Publier</span></button>
    </div>
    <button class="rail-foot">
      <div class="av sm" style="background:#2563EB">SB</div>
      <div class="who grow col" style="align-items:flex-start;line-height:1.2">
        <span class="t-bold t-sm truncate">Sara Benali</span>
        <span class="t-xs t-dim truncate">@sara.b</span>
      </div>
    </button>
  </nav>

  <main class="main" id="main">
    <div class="view full"><div class="view-inner" id="viewInner"></div></div>
  </main>
</div>

<div class="hintbar blur-menu">
  <span><b>Cliquez</b> une bulle → outils</span>
  <span>·</span>
  <span>Clic droit → menu</span>
  <span>·</span>
  <span>Barre du haut → infos</span>
  <span>·</span>
  <span>Micro et envoi séparés</span>
  <span>·</span>
  <span><span class="kbd">↑</span> modifier</span>
  <span>·</span>
  <span><span class="kbd">Échap</span></span>
  <span>·</span>
  <button class="btn btn-ghost btn-sm" id="btnTheme"><i data-icon="moon"></i></button>
  <button class="btn btn-ghost btn-sm" id="btnDir">RTL</button>
</div>

<div class="toasts" id="kl-toasts"></div>
<div id="kl-overlay"></div>
<div id="kl-menu"></div>

<script type="module">
import { icon } from './js/core/icons_sm.js';
import { initStore, me } from './js/core/store_sm.js';
import { initRouter } from './js/core/router_sm.js';
import { initMessages, openThread } from './js/features/messages_sm.js';

for (const n of document.querySelectorAll('[data-icon]')) n.innerHTML = icon(n.dataset.icon);

initStore();
me.set({ id:'u1', username:'sara.b', full_name:'Sara Benali', status:'approved', role:'student' });

initMessages(() => document.getElementById('viewInner'));
initRouter({ start: 'messages' });

setTimeout(() => openThread('u2'), 120);

document.getElementById('btnTheme').onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
};
document.getElementById('btnDir').onclick = () => {
  const h = document.documentElement;
  h.dir = h.dir === 'rtl' ? 'ltr' : 'rtl';
};
</script>
</body>
</html>
