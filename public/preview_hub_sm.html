<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koliya — Hub &amp; Profil</title>
<meta name="theme-color" content="#FAFAF9">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base_sm.css">
<link rel="stylesheet" href="css/components_sm.css">
<link rel="stylesheet" href="css/layout_sm.css">
<style>
  .hintbar{position:fixed;bottom:var(--s4);left:50%;transform:translateX(-50%);z-index:90;
    display:flex;gap:var(--s3);align-items:center;padding:var(--s2) var(--s4);
    border-radius:var(--r-full);border:1px solid var(--border);
    font-size:var(--fs-xs);color:var(--text-2);box-shadow:var(--shadow)}
</style>
</head>
<body>

<div id="app" class="app" data-rail="expanded">
  <nav class="nav-rail" id="rail">
    <div class="rail-logo"><span class="mark">K</span><span class="word">Koliya</span></div>
    <div class="rail-nav">
      <a class="nav-item primary" href="#/feed" data-nav="feed"><i data-icon="home"></i><span class="lbl">Accueil</span></a>
      <a class="nav-item primary" href="#/messages" data-nav="messages"><i data-icon="message"></i><span class="lbl">Messages</span></a>
      <a class="nav-item primary" href="#/hub" data-nav="hub"><i data-icon="trophy"></i><span class="lbl">Hub</span></a>
      <a class="nav-item" href="#/profile/sara.b"><i data-icon="user"></i><span class="lbl">Mon profil</span></a>
      <a class="nav-item" href="#/profile/youssef"><i data-icon="users"></i><span class="lbl">Profil de Youssef</span></a>
      <a class="nav-item" href="#/profile/leila"><i data-icon="lock"></i><span class="lbl">Compte privé</span></a>
    </div>
    <button class="rail-foot">
      <div class="av sm" style="background:#2563EB">SB</div>
      <div class="who grow col" style="align-items:flex-start;line-height:1.2">
        <span class="t-bold t-sm truncate">Sara Benali</span>
        <span class="t-xs t-dim truncate">@sara.b</span>
      </div>
    </button>
  </nav>

  <main class="main" id="main">
    <header class="topbar blur-bar">
      <button class="icon-btn back-btn" id="btnBack"><i data-icon="arrowLeft"></i></button>
      <span class="topbar-title" id="topbarTitle">Hub</span>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnQuest" data-tip="Simuler un défi"><i data-icon="check"></i></button>
        <button class="icon-btn" id="btnTheme"><i data-icon="moon"></i></button>
      </div>
    </header>
    <div class="view" id="view"><div class="view-inner" id="viewInner"></div></div>
  </main>
</div>

<div class="hintbar blur-menu">
  <span>Hub → défis, badges, classement</span><span>·</span>
  <span>Profil → couverture qui rétrécit au défilement</span><span>·</span>
  <span>Essayez « Compte privé »</span>
</div>

<div class="toasts" id="kl-toasts"></div>
<div id="kl-overlay"></div>
<div id="kl-menu"></div>

<script type="module">
import { icon } from './js/core/icons_sm.js';
import { initStore, me } from './js/core/store_sm.js';
import { initRouter, back } from './js/core/router_sm.js';
import { initShell } from './js/core/shell_sm.js';
import { initHub, trackQuest } from './js/features/hub_sm.js';
import { initProfile } from './js/features/profile_sm.js';

for (const n of document.querySelectorAll('[data-icon]')) n.innerHTML = icon(n.dataset.icon);

initStore();
me.set({ id:'u1', username:'sara.b', full_name:'Sara Benali', faculty:'Informatique',
         status:'approved', role:'student', bio:'Étudiante en L3 informatique. J\'aime les algos et le café.' });
initShell();
const mount = () => document.getElementById('viewInner');
initHub(mount);
initProfile(mount);
initRouter({ start: 'hub' });

document.getElementById('btnBack').onclick = () => back();
document.getElementById('btnQuest').onclick = () => trackQuest('post', 1);
document.getElementById('btnTheme').onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
};
</script>

</html>
