# ============================================================
# KOLIYA — Render Static Site
#
# The app is a static site: it talks to Neon over HTTPS from the
# browser, so there is no Node server to run and nothing to build.
#
# THE ONE TRAP
# ------------
# Our entry file is index_sm.html, but every static host — Render
# included — serves index.html for "/". Without the rewrite below,
# visiting the site returns 404 Not Found.
# ============================================================

services:
  - type: web
    name: koliya
    runtime: static
    # Nothing to compile. Everything under public/ is shipped as-is.
    buildCommand: ""
    staticPublishPath: ./public

    # Send every path to the app shell. Routing happens in the
    # browser via the hash (#/feed, #/messages/u2), so the server
    # only ever needs to hand over one file.
    routes:
      - type: rewrite
        source: /*
        destination: /index_sm.html

    headers:
      # The service worker must never be cached, or students stay
      # stuck on an old version after every deploy.
      - path: /sw_sm.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

      - path: /index_sm.html
        name: Cache-Control
        value: no-cache

      # Fingerprint-free assets: revalidate but allow reuse.
      - path: /css/*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /js/*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate

      # Icons rarely change.
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=604800

      # Basic hardening. The app loads no third-party scripts beyond
      # Google Fonts, and all data goes to Neon over HTTPS.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), geolocation=()
